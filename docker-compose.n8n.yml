# n8n — dados em E:\lanchonete-n8n-data (Docker Desktop ligado).
# npm run n8n:up
# http://localhost:5678

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: lanchonete-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - e:/lanchonete-n8n-data:/home/node/.n8n
